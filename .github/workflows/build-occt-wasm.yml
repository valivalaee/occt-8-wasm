
name: Build OCCT 8.0.1 WebAssembly

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout OCCT WASM source
        uses: actions/checkout@v5
        with:
          repository: andymai/occt-wasm
          ref: main
          path: occt-wasm
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build Docker image
        working-directory: occt-wasm
        run: |
          git submodule status
          test -f occt/CMakeLists.txt
          npm install
          npm run docker:build

      - name: Build WASM distribution
        working-directory: occt-wasm
        run: npm run docker:dist

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: occt-8.0.1-wasm-dist
          path: occt-wasm/dist/
          if-no-files-found: error

