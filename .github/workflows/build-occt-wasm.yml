name: Build OCCT WASM (IGES + Wedge extended)

on:
  workflow_dispatch:
    inputs:
      builder:
        description: "prebuilt = fast (about 15 min). full = compile OCCT libs from scratch (about 60 min)"
        type: choice
        options:
          - prebuilt
          - full
        default: prebuilt
      optimize_size:
        description: "Smaller wasm file (-Oz), slightly slower at runtime"
        type: boolean
        default: false
      publish_release:
        description: "After tests pass, publish files as a GitHub Release (permanent download links)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Pinned upstream commit of andymai/occt-wasm that this patch was written against.
  UPSTREAM_SHA: 2c643c78c8a23b21ab5f4b4a8957fb0851d9fa93

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout upstream occt-wasm (pinned) with OCCT submodule
        uses: actions/checkout@v4
        with:
          repository: andymai/occt-wasm
          ref: ${{ env.UPSTREAM_SHA }}
          path: occt-wasm
          submodules: recursive

      - name: Patch upstream (adds IGES import/export and Wedge)
        working-directory: occt-wasm
        run: |
          python3 - <<'PYEOF'
          import sys
          # Run from the root of the occt-wasm checkout. Anchored edits; fails loudly if upstream changed.
          def edit(path, fn):
              s = open(path, encoding='utf-8').read()
              s2 = fn(s)
              open(path, 'w', encoding='utf-8').write(s2)

          def replace_once(s, old, new, what):
              if s.count(old) != 1:
                  sys.exit('PATCH FAILED: anchor not found exactly once for: ' + what)
              return s.replace(old, new)

          WEDGE = '''    // ── occt-wasm-ext: wedge primitives (used by the sheet-metal editor) ──
              // BRepPrimAPI_MakeWedge(dx, dy, dz, ltx): a box whose top face is shrunk
              // to length ltx along X (ltx = 0 gives a triangular prism).
              MethodSpec {
                  name: "makeWedge",
                  kind: MethodKind::SimpleShape,
                  params: &[
                      FacadeParam::Double("dx"),
                      FacadeParam::Double("dy"),
                      FacadeParam::Double("dz"),
                      FacadeParam::Double("ltx"),
                  ],
                  occt_class: "BRepPrimAPI_MakeWedge",
                  ctor_args: "dx, dy, dz, ltx",
                  setup_code: "",
                  includes: &[],
                  category: "primitives",
                  return_type: ReturnType::ShapeId,
              },
              // BRepPrimAPI_MakeWedge(dx, dy, dz, xmin, zmin, xmax, zmax): the top face
              // is the rectangle [xmin, xmax] x [zmin, zmax] (a frustum / pyramid).
              MethodSpec {
                  name: "makeWedgeBox",
                  kind: MethodKind::SimpleShape,
                  params: &[
                      FacadeParam::Double("dx"),
                      FacadeParam::Double("dy"),
                      FacadeParam::Double("dz"),
                      FacadeParam::Double("xmin"),
                      FacadeParam::Double("zmin"),
                      FacadeParam::Double("xmax"),
                      FacadeParam::Double("zmax"),
                  ],
                  occt_class: "BRepPrimAPI_MakeWedge",
                  ctor_args: "dx, dy, dz, xmin, zmin, xmax, zmax",
                  setup_code: "",
                  includes: &[],
                  category: "primitives",
                  return_type: ReturnType::ShapeId,
              },
              // ── occt-wasm-ext: IGES exchange ──────────────────────────────────
              // Streams, not files, like importStep/exportStep. Default brep mode (0):
              // faces are written as trimmed surfaces, the form most CAD systems read.
              MethodSpec {
                  name: "exportIges",
                  kind: MethodKind::CustomBody,
                  params: &[FacadeParam::ShapeId("id")],
                  occt_class: "",
                  ctor_args: "",
                  setup_code: "\\
          IGESControl_Controller::Init();
          IGESControl_Writer writer(\\"MM\\", 0);
          if (!writer.AddShape(get(id))) {
              throw std::runtime_error(\\"exportIges: shape could not be added\\");
          }
          writer.ComputeModel();
          std::ostringstream oss;
          if (!writer.Write(oss)) {
              throw std::runtime_error(\\"exportIges: failed to write IGES data\\");
          }
          return oss.str();",
                  includes: &[
                      "IGESControl_Controller.hxx",
                      "IGESControl_Writer.hxx",
                      "sstream",
                  ],
                  category: "io",
                  return_type: ReturnType::String,
              },
              MethodSpec {
                  name: "importIges",
                  kind: MethodKind::CustomBody,
                  params: &[FacadeParam::String("data")],
                  occt_class: "",
                  ctor_args: "",
                  setup_code: "\\
          IGESControl_Controller::Init();
          IGESControl_Reader reader;
          std::istringstream iss(data);
          IFSelect_ReturnStatus status = reader.ReadStream(\\"import.igs\\", iss);
          if (status != IFSelect_RetDone) {
              throw std::runtime_error(\\"importIges: failed to read IGES data\\");
          }
          reader.TransferRoots();
          if (reader.NbShapes() == 0) {
              throw std::runtime_error(\\"importIges: no shapes found in IGES data\\");
          }
          return store(reader.OneShape());",
                  includes: &[
                      "IFSelect_ReturnStatus.hxx",
                      "IGESControl_Controller.hxx",
                      "IGESControl_Reader.hxx",
                      "sstream",
                  ],
                  category: "io",
                  return_type: ReturnType::ShapeId,
              },
          '''

          def cfg(s):
              if 'occt-wasm-ext' in s:
                  print('config.rs already patched'); return s
              return replace_once(s, '];\n\n/// Returns the complete list of facade method specifications.',
                                  WEDGE + '];\n\n/// Returns the complete list of facade method specifications.', 'config.rs end of TARGET_METHODS')
          edit('xtask/src/codegen/config.rs', cfg)

          def bld(s):
              old = '    // IGES exchange (deliberately excluded — STEP is the modern standard, saves ~1-2 MB)\n    "libTKDEIGES.a",\n'
              if old not in s and 'occt-wasm-ext' in s:
                  print('build.rs already patched'); return s
              return replace_once(s, old, '    // IGES exchange is linked in (occt-wasm-ext: exportIges / importIges).\n', 'build.rs EXCLUDED_LIBS')
          edit('xtask/src/build.rs', bld)

          def hdr(s):
              if 'makeWedgeBox' in s:
                  print('header already patched'); return s
              a = '    uint32_t makeTorus(double majorRadius, double minorRadius);\n'
              s = replace_once(s, a, a + '    uint32_t makeWedge(double dx, double dy, double dz, double ltx);\n'
                               '    uint32_t makeWedgeBox(double dx, double dy, double dz, double xmin, double zmin, double xmax,\n'
                               '                          double zmax);\n', 'header makeTorus')
              b = '    std::string exportStep(uint32_t id);\n'
              return replace_once(s, b, b + '    uint32_t importIges(const std::string& data);\n    std::string exportIges(uint32_t id);\n', 'header exportStep')
          edit('facade/include/occt_kernel.h', hdr)
          print('patch applied OK')
          PYEOF

      - name: Prepare builder image
        run: |
          OCCT_REV=$(git -C occt-wasm rev-parse --short HEAD:occt)
          echo "OCCT submodule rev: $OCCT_REV"
          if [ "${{ inputs.builder }}" = "full" ]; then
            docker build -f occt-wasm/Dockerfile.builder -t occt-builder occt-wasm
            echo "IMAGE=occt-builder" >> "$GITHUB_ENV"
          else
            REPO=ghcr.io/andymai/occt-wasm-builder
            if docker pull "$REPO:$OCCT_REV"; then
              echo "IMAGE=$REPO:$OCCT_REV" >> "$GITHUB_ENV"
            else
              echo "::warning::tag $OCCT_REV not found, falling back to :latest"
              docker pull "$REPO:latest"
              echo "IMAGE=$REPO:latest" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build WASM (codegen, compile facade, link)
        run: |
          cat > ci-build.sh <<'SHEOF'
          #!/usr/bin/env bash
          # Runs INSIDE the occt-wasm-builder container. cwd = occt-wasm checkout.
          set -euxo pipefail
          git config --global --add safe.directory '*'
          rm -rf occt/build 3rdparty
          cp -r /workspace/occt/build occt/build
          cp -r /workspace/3rdparty 3rdparty
          test -n "$(find occt/build -name libTKDEIGES.a | head -1)" || { echo "libTKDEIGES.a missing in builder image"; exit 1; }
          test -f occt/build/include/opencascade/IGESControl_Writer.hxx || { echo "IGES headers missing"; exit 1; }
          cargo xtask codegen
          grep -q exportIges facade/generated/kernel.cpp
          grep -q makeWedgeBox facade/generated/bindings.cpp
          cargo xtask build --release ${SIZE_FLAG:-}
          ls -la dist
          test -s dist/occt-wasm.wasm
          test -s dist/occt-wasm.js
          SHEOF
          docker run --rm -v "$PWD:/src" -w /src/occt-wasm \
            -e SIZE_FLAG="${{ inputs.optimize_size && '--size' || '' }}" \
            "$IMAGE" bash /src/ci-build.sh
          # docker ran as root: give the runner user ownership of the build output
          sudo chown -R "$(id -u):$(id -g)" occt-wasm

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke tests (must pass before anything is published)
        run: |
          cat > smoke.mjs <<'JSEOF'
          // Smoke test for the extended occt-wasm build. Usage: node smoke.mjs <dist-dir>
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const dir = path.resolve(process.argv[2] || 'dist');
          // Load from a private temp copy so a root-owned dist/ (docker run) can never block us.
          const work = fs.mkdtempSync(path.join(os.tmpdir(), 'occt-'));
          fs.copyFileSync(path.join(dir, 'occt-wasm.js'), path.join(work, 'occt-wasm.mjs'));
          fs.copyFileSync(path.join(dir, 'occt-wasm.wasm'), path.join(work, 'occt-wasm.wasm'));
          const create = (await import(pathToFileURL(path.join(work, 'occt-wasm.mjs')).href)).default;
          const m = await create();
          const k = new m.OcctKernel();

          const results = [];
          const near = (a, b, rel = 0.01) => Math.abs(a - b) <= Math.abs(b) * rel + 1e-6;
          function test(name, fn) {
            try {
              const r = fn();
              results.push({ name, ok: r === true || r === undefined, detail: r === true ? '' : String(r ?? '') });
            } catch (e) {
              results.push({ name, ok: false, detail: String((e && e.message) || e).slice(0, 200) });
            }
          }
          const vec = (ids) => { const v = new m.VectorUint32(); for (const x of ids) v.push_back(x); return v; };

          const box = k.makeBox(10, 20, 30);          // volume 6000
          const cyl = k.makeCylinder(4, 40);          // overlaps one quarter at the origin corner
          const quarter = (Math.PI * 16 / 4) * 30;    // overlap volume = 376.99

          test('box volume', () => near(k.getVolume(box), 6000) || k.getVolume(box));
          test('fuse', () => { const v = k.getVolume(k.fuse(box, cyl)); return near(v, 6000 + 40 * Math.PI * 16 - quarter) || v; });
          test('cut', () => { const v = k.getVolume(k.cut(box, cyl)); return near(v, 6000 - quarter) || v; });
          test('common', () => { const v = k.getVolume(k.common(box, cyl)); return near(v, quarter) || v; });
          test('fillet all edges', () => {
            const v = k.getVolume(k.fillet(box, vec(k.getSubShapes(box, 'edge')), 1));
            return (v > 5000 && v < 6000) || v;
          });
          test('boolean with fuzzy value', () => {
            const r = k.booleanOp(0, vec([box]), vec([cyl]), 0, 1e-5, 0, new m.VectorInt(), 0);
            const v = k.getVolume(r.resultId);
            return near(v, 6000 + 40 * Math.PI * 16 - quarter) || v;
          });
          test('sweep transition modes exist', () => typeof k.sweep === 'function');
          test('STEP round trip', () => {
            const s = k.exportStep(box);
            const v = k.getVolume(k.importStep(s));
            return (s.includes('ISO-10303-21') && near(v, 6000)) || 'vol=' + v;
          });

          // --- extensions added by this build ---
          test('makeWedge triangular prism (ltx=0)', () => near(k.getVolume(k.makeWedge(2, 3, 4, 0)), 12) || k.getVolume(k.makeWedge(2, 3, 4, 0)));
          test('makeWedge full box (ltx=dx)', () => near(k.getVolume(k.makeWedge(2, 3, 4, 2)), 24) || 'bad volume');
          test('makeWedgeBox frustum', () => {
            const v = k.getVolume(k.makeWedgeBox(4, 4, 4, 1, 1, 3, 3));
            return (v > 20 && v < 64) || v;
          });
          test('IGES export', () => {
            const s = k.exportIges(box);
            return (typeof s === 'string' && s.length > 500 && /^.{72}S\s+1/m.test(s) && /^.{72}T\s+1/m.test(s)) || 'len=' + (s && s.length);
          });
          test('IGES round trip (6 faces, area)', () => {
            const id = k.importIges(k.exportIges(box));
            const faces = k.subShapeCount(id, 'face');
            const area = k.getSurfaceArea(id);
            return (faces === 6 && near(area, 2200, 0.02)) || `faces=${faces} area=${area}`;
          });

          const failed = results.filter((r) => !r.ok);
          for (const r of results) console.log((r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.detail ? '  -> ' + r.detail : ''));
          const report = JSON.stringify({ total: results.length, failed: failed.length, results }, null, 2);
          try { fs.writeFileSync(path.join(dir, 'smoke-report.json'), report); } catch (e) { fs.writeFileSync(path.join(work, 'smoke-report.json'), report); }
          console.log(`\n${results.length - failed.length}/${results.length} passed`);
          process.exit(failed.length ? 1 : 0);
          JSEOF
          node smoke.mjs occt-wasm/dist

      - name: Upload smoke report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: occt-wasm/dist/smoke-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Collect output files
        run: |
          mkdir -p out
          cp occt-wasm/dist/occt-wasm.js occt-wasm/dist/occt-wasm.wasm out/
          VF=$(find occt-wasm/occt -name Standard_Version.hxx | head -1)
          {
            echo "upstream occt-wasm: $UPSTREAM_SHA"
            echo "occt submodule:     $(git -C occt-wasm rev-parse HEAD:occt)"
            echo "extensions:         makeWedge, makeWedgeBox, exportIges, importIges"
            echo "optimize_size:      ${{ inputs.optimize_size }}"
            grep -E '#define OCC_VERSION_(COMPLETE|STRING_EXT|DEVELOPMENT)' "$VF" || true
          } > out/VERSION.txt
          cat out/VERSION.txt
          ls -la out

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: occt-ext-wasm-dist
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="occt-ext-run${{ github.run_number }}"
          gh release create "$TAG" out/occt-wasm.js out/occt-wasm.wasm out/VERSION.txt \
            --repo "${{ github.repository }}" \
            --title "OCCT WASM (IGES + Wedge) build ${{ github.run_number }}" \
            --notes-file out/VERSION.txt
