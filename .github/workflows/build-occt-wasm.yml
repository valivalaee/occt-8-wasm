name: Build OCCT 8.0.1 WebAssembly

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OCCT WASM source
        uses: actions/checkout@v4
        with:
          repository: andymai/occt-wasm
          path: occt-wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Docker image
        working-directory: occt-wasm
        run: npm install && npm run docker:build

      - name: Build WASM distribution
        working-directory: occt-wasm
        run: npm run docker:dist

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: occt-8.0.1-wasm-dist
          path: occt-wasm/dist/
          if-no-files-found: error
